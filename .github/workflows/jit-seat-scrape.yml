# JIT Seat Scraper - Hourly Edition
# Scrapes seat layouts for showtimes starting in the next 5-65 minutes
name: JIT Seat Scrape

on:
  schedule:
    # Every hour from 09:52 to 22:52 WIB (02:52 to 15:52 UTC)
    # Run at :52 to catch :00 showtimes 8 minutes before start
    - cron: '52 2-15 * * *'
  workflow_dispatch:
    inputs:
      window_minutes:
        description: 'JIT window in minutes (default: 60 for hourly)'
        required: false
        default: '60'

jobs:
  token-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync

      - name: Refresh token via API
        run: |
          uv run python -c "
          import asyncio
          from backend.infrastructure.token_refresher import TokenRefresher

          async def refresh():
              refresher = TokenRefresher()
              token = await refresher.ensure_valid_token()
              print(f'✅ Token valid: {token.minutes_until_expiry} min remaining')

          asyncio.run(refresh())
          "
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

  jit-scrape:
    needs: token-refresh
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync

      # Download latest movie data from Firestore (no artifact needed)
      - name: Run JIT seat scraper
        run: |
          uv run python -m backend.cli.cli seats \
            --mode jit \
            --jit-window ${{ inputs.window_minutes || '60' }} \
            --use-stored-token
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Upload JIT seat data
        run: uv run python -m backend.cli.upload_seats
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Aggregate movie performance
        run: uv run python -m backend.cli.movie_performance --recalculate
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
