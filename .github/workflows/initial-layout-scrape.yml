# Initial Layout Scraper - Scrape seat layouts for tomorrow's showtimes
# Runs at 5am Jakarta time to capture "empty" theater state before sales
name: Initial Layout Scrape

on:
  schedule:
    - cron: '0 22 * * *'  # 5 AM WIB (22:00 UTC previous day)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync

      - name: Scrape initial seat layouts for tomorrow
        run: |
          # Calculate tomorrow's date in Jakarta timezone
          TOMORROW=$(TZ=Asia/Jakarta date -d "+1 day" +%Y-%m-%d)
          echo "📅 Scraping initial layouts for: $TOMORROW"
          PYTHONPATH=. uv run python backend/scripts/scrape_initial_layouts.py --date $TOMORROW
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

  alert:
    needs: scrape
    if: failure()
    runs-on: ubuntu-latest

    steps:
      - name: Alert on failure
        uses: actions/github-script@v8
        with:
          script: |
            const title = '🚨 Initial Layout Scrape Failed';
            const body = `## Initial Layout Scrape Failed
            
            **Run ID:** ${{ github.run_id }}
            **Time:** ${new Date().toISOString()}
            
            The initial layout scraper failed. Possible causes:
            - TIX.id API changed
            - Token refresh failed
            - Network timeout
            - Firestore write failed
            
            **Action Required:**
            1. Check the [workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            2. Re-run the workflow manually if transient failure
            
            cc @${{ github.repository_owner }}`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'scraper']
            });
