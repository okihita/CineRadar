# Daily Morning Scraper - Parallel Edition
name: Daily Morning Scrape

on:
  schedule:
    - cron: '0 23 * * *'  # 6 AM WIB
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        batch: [0, 1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          uv sync
          uv run playwright install chromium
          uv run playwright install-deps chromium

      - name: Run scraper batch ${{ matrix.batch }}
        run: uv run python -m backend.cli --schedules --batch ${{ matrix.batch }} --total-batches 9

      - name: Upload batch artifact
        uses: actions/upload-artifact@v6
        with:
          name: batch-${{ matrix.batch }}
          path: data/batch_*.json
          retention-days: 1

  merge:
    needs: scrape
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync

      - name: Download all batch artifacts
        uses: actions/download-artifact@v7
        with:
          path: data/
          pattern: batch-*
          merge-multiple: true

      - name: Merge batches
        run: uv run python -m backend.cli.merge_batches

      - name: Validate merged data
        run: uv run python -m backend.cli.validate

      - name: Upload to Firestore
        run: uv run python -m backend.cli.populate_firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Upload per-movie schedules
        run: uv run python -m backend.cli.upload_schedules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Initialize Performance Data
        run: uv run python -m backend.cli.movie_performance --init-only
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Scrape Movie Details
        run: uv run python -m backend.cli movie-details --all
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Upload final artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scrape-data-${{ github.run_id }}
          path: data/movies_*.json
          retention-days: 7

  # Note: Seat scraping moved to jit-seat-scrape.yml (runs hourly)

  alert:
    needs: merge
    if: failure()
    runs-on: ubuntu-latest

    steps:
      - name: Alert on failure
        uses: actions/github-script@v8
        with:
          script: |
            const title = '🚨 Daily Scrape Failed';
            const body = `## Daily Scrape Workflow Failed
            
            **Run ID:** ${{ github.run_id }}
            **Time:** ${new Date().toISOString()}
            
            The daily movie scrape failed. Possible causes:
            - TIX.id website changed
            - Network timeout
            - Firestore write failed
            
            **Action Required:**
            1. Check the [workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            2. Re-run the workflow manually if transient failure
            
            cc @${{ github.repository_owner }}`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'scraper']
            });
