name: Scraper Alert Monitor

on:
  schedule:
    # Every 10 minutes
    - cron: '*/10 * * * *'

permissions:
  contents: read
  issues: write

jobs:
  monitor-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install google-cloud-logging

      - name: Monitor scraper health
        id: monitor
        run: |
          python3 << 'EOF'
          import os
          from google.cloud import logging
          from datetime import datetime, timedelta

          PROJECT_ID = os.environ.get("GOOGLE_CLOUD_PROJECT", "cineradar-481014")

          client = logging.Client(project=PROJECT_ID)

          # Check last 10 minutes
          end_time = datetime.utcnow()
          start_time = end_time - timedelta(minutes=10)

          anomalies = []

          # 1. High error rate (>10% in last 10 minutes)
          total_requests_filter = f'''
            resource.type="cloud_function"
            AND resource.labels.function_name="scrape-seat-jit"
            AND timestamp >= "{start_time.isoformat()}Z"
            AND timestamp < "{end_time.isoformat()}Z"
          '''

          total_requests = sum(1 for _ in client.list_entries(filter_=total_requests_filter))

          errors_filter = f'''
            resource.type="cloud_function"
            AND resource.labels.function_name="scrape-seat-jit"
            AND severity>=ERROR
            AND timestamp >= "{start_time.isoformat()}Z"
            AND timestamp < "{end_time.isoformat()}Z"
          '''

          error_count = sum(1 for _ in client.list_entries(filter_=errors_filter))

          if total_requests > 0:
              error_rate = (error_count / total_requests) * 100
              if error_rate > 10:
                  anomalies.append({
                      "type": "HIGH_ERROR_RATE",
                      "message": f"Error rate: {error_rate:.1f}% ({error_count}/{total_requests})",
                      "severity": "CRITICAL"
                  })

          # 2. Schema validation failures
          schema_errors_filter = f'''
            resource.type="cloud_function"
            AND resource.labels.function_name="scrape-seat-jit"
            AND (
              jsonPayload.message contains "Schema validation failed"
              OR jsonPayload.message contains "seat_map is not a list"
            )
            AND timestamp >= "{start_time.isoformat()}Z"
            AND timestamp < "{end_time.isoformat()}Z"
          '''

          schema_errors = list(client.list_entries(filter_=schema_errors_filter))
          if schema_errors:
              anomalies.append({
                  "type": "SCHEMA_VALIDATION_FAILURE",
                  "message": f"Schema validation failed: {len(schema_errors)} occurrences",
                  "severity": "CRITICAL"
              })

          # 3. No showtimes scraped in last 20 minutes (during business hours)
          # Business hours: 9 AM - 11 PM WIB = 02:00 - 16:00 UTC
          now_utc = datetime.utcnow()
          business_hours_start = now_utc.replace(hour=2, minute=0, second=0, microsecond=0)
          business_hours_end = now_utc.replace(hour=16, minute=0, second=0, microsecond=0)

          if business_hours_start <= now_utc <= business_hours_end:
              # Check for successful scrapes in last 20 minutes
              success_filter = f'''
                resource.type="cloud_function"
                AND resource.labels.function_name="scrape-seat-jit"
                AND jsonPayload.message contains "Saved snapshot"
                AND timestamp >= "{start_time.isoformat()}Z"
                AND timestamp < "{end_time.isoformat()}Z"
              '''

              successful_scrapes = sum(1 for _ in client.list_entries(filter_=success_filter))

              if successful_scrapes == 0:
                  anomalies.append({
                      "type": "NO_SHOWTIMES_SCRAPED",
                      "message": "No showtimes successfully scraped in last 20 minutes",
                      "severity": "WARNING"
                  })

          # Output findings
          if anomalies:
              print("ANOMALIES_DETECTED=1")
              for i, anomaly in enumerate(anomalies, 1):
                  print(f"ANOMALY_{i}_TYPE={anomaly['type']}")
                  print(f"ANOMALY_{i}_MESSAGE={anomaly['message']}")
                  print(f"ANOMALY_{i}_SEVERITY={anomaly['severity']}")
              print(f"TOTAL_ANOMALIES={len(anomalies)}")
          else:
              print("ANOMALIES_DETECTED=0")
              print("STATUS=HEALTHY")
          EOF

      - name: Create GitHub Issue (if anomalies detected)
        if: steps.monitor.outputs.ANOMALIES_DETECTED == '1'
        uses: actions/github-script@v8
        with:
          script: |
            const anomalies = [];
            let i = 1;
            while (true) {
                const type = process.env[`ANOMALY_${i}_TYPE`];
                if (!type) break;
                anomalies.push({
                    type,
                    message: process.env[`ANOMALY_${i}_MESSAGE`],
                    severity: process.env[`ANOMALY_${i}_SEVERITY`]
                });
                i++;
            }

            const total = process.env.TOTAL_ANOMALIES;

            const now = new Date().toISOString();

            const emoji = anomalies.some(a => a.severity === 'CRITICAL') ? '🔴' : '🟡';
            const title = `${emoji} Scraper Anomaly Detected (${total} issue${total > 1 ? 's' : ''})`;

            const body = `
              ## Alert Time
              ${now}

              ## Issues Found

              ${anomalies.map(a => `
              ### ${a.severity}: ${a.type}
              ${a.message}
              `).join('\n')}

              ## Recommended Actions

              ${anomalies.filter(a => a.severity === 'CRITICAL').length > 0 ? '- Check Cloud Logging for details\n- Verify API responses' : '- Monitor for persistence'}

              ---

              *This issue was automatically created by Scraper Alert Monitor workflow.*
            `;

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['scraper-alert', 'automated']
            });
            console.log('Created GitHub issue for scraper anomalies');

      - name: Print status
        if: steps.monitor.outputs.ANOMALIES_DETECTED == '0'
        run: |
          echo "✅ Scraper is healthy - no anomalies detected"
