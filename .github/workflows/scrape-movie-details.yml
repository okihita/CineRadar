name: Scrape Missing Movie Details

on:
  schedule:
    - cron: '30 23 * * *'  # 06:30 WIB (23:30 UTC previous day) — after primary scrape & layout
    - cron: '0 3 * * *'    # 10:00 WIB (03:00 UTC) — after secondary scrape & layout
  workflow_dispatch:

jobs:
  scrape-details:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.0.0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync

      - name: Scrape Movie Details with Daily Rating Updates
        run: uv run python -m backend.cli movie-details --from-performance --update-ratings
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const title = '🚨 Daily Metadata Backfill Failed';
            const body = `## Movie Details Scrape Failed
            
            **Run ID:** ${{ github.run_id }}
            **Time:** ${new Date().toISOString()}
            
            The 7 AM WIB metadata backfill failed.
            
            **Action Required:**
            1. Check the [workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            2. Re-run the workflow manually if transient failure
            
            cc @${{ github.repository_owner }}`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'scraper']
            });
