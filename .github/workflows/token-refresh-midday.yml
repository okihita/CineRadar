# Mid-day Token Refresh
# Ensures JIT workflows have valid tokens throughout the day
name: Token Refresh Midday

on:
  schedule:
    # 12:00 WIB (05:00 UTC)
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync

      - name: Refresh token via API
        run: |
          uv run python -c "
          import asyncio
          from backend.infrastructure.token_refresher import TokenRefresher

          async def refresh():
              refresher = TokenRefresher()
              token = await refresher.ensure_valid_token()
              print(f'✅ Token valid: {token.minutes_until_expiry} min remaining')

          asyncio.run(refresh())
          "
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
