name: Scraper Daily Digest

on:
  schedule:
    # Daily at 11 PM WIB (4 PM UTC)
    - cron: '0 16 * * *'

permissions:
  contents: read
  issues: write

jobs:
  generate-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install google-cloud-logging

      - name: Generate daily digest
        id: digest
        run: |
          python3 << 'EOF'
          import os
          from google.cloud import logging
          from datetime import datetime, timedelta

          PROJECT_ID = os.environ.get("GOOGLE_CLOUD_PROJECT", "cineradar-481014")

          client = logging.Client(project=PROJECT_ID)

          # Query logs for last 24 hours
          end_time = datetime.utcnow()
          start_time = end_time - timedelta(hours=24)

          # Critical errors
          critical_filter = f'''
            resource.type="cloud_function"
            AND resource.labels.function_name="scrape-seat-jit"
            AND (
              severity="CRITICAL"
              OR jsonPayload.message contains "CRITICAL"
              OR jsonPayload.message contains "🚨"
            )
            AND timestamp >= "{start_time.isoformat()}Z"
            AND timestamp < "{end_time.isoformat()}Z"
          '''

          critical_count = sum(1 for _ in client.list_entries(filter_=critical_filter))

          # Warnings
          warning_filter = f'''
            resource.type="cloud_function"
            AND resource.labels.function_name="scrape-seat-jit"
            AND (
              severity="WARNING"
              OR jsonPayload.message contains "WARNING"
              OR jsonPayload.message contains "⚠️"
            )
            AND timestamp >= "{start_time.isoformat()}Z"
            AND timestamp < "{end_time.isoformat()}Z"
          '''

          warning_count = sum(1 for _ in client.list_entries(filter_=warning_filter))

          # All errors
          all_errors_filter = f'''
            resource.type="cloud_function"
            AND resource.labels.function_name="scrape-seat-jit"
            AND severity>=ERROR
            AND timestamp >= "{start_time.isoformat()}Z"
            AND timestamp < "{end_time.isoformat()}Z"
          '''

          all_errors_count = sum(1 for _ in client.list_entries(filter_=all_errors_filter))

          # Determine status
          status_emoji = '🟢 SUCCESS' if critical_count == 0 else '🔴 CRITICAL ISSUES'

          # Generate digest
          digest = f"""
          📊 CineRadar Scraper Daily Digest - {start_time.strftime('%Y-%m-%d')}

          Status: {status_emoji}

          Metrics:
          - Critical errors: {critical_count}
          - Warnings: {warning_count}
          - Total errors: {all_errors_count}

          {'⚠️ Review critical errors in Cloud Logging' if critical_count > 0 else '✅ No critical issues detected'}
          """

          # Set output for GitHub Actions
          with open('digest.txt', 'w') as f:
              f.write(digest)

          print(digest)
          EOF

      - name: Create GitHub Issue (if critical errors)
        if: steps.digest.outputs.status == 'critical'
        uses: actions/github-script@v8
        with:
          script: |
            const digest = require('fs').readFileSync('digest.txt', 'utf-8');
            const today = new Date().toISOString().split('T')[0];

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Scraper Daily Digest - ${today}`,
              body: digest,
              labels: ['scraper-alert', 'daily-digest']
            });
            console.log('Created GitHub issue for daily digest');

      - name: Print digest
        run: |
          cat digest.txt
