# Daily Initial Scraper - V2 API Edition
# Pure HTTP API scraper (no Playwright required)
name: Daily Initial Scrape

on:
  schedule:
    - cron: '0 18 * * *'  # 01:00 WIB (18:00 UTC)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync
        # NOTE: No Playwright installation needed - V2 uses pure HTTP API

      - name: Run V2 API scraper
        run: PYTHONPATH=. uv run python backend/scripts/run_national_scrape.py
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Sync post-processing data
        run: PYTHONPATH=. uv run python backend/scripts/post_process.py
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Initialize Performance Data
        run: uv run python -m backend.cli.movie_performance --init-only
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Scrape Movie Details
        run: uv run python -m backend.cli movie-details --all
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

  # Note: Seat scraping moved to jit-seat-scrape.yml (runs hourly)

  alert:
    needs: scrape
    if: failure()
    runs-on: ubuntu-latest

    steps:
      - name: Alert on failure
        uses: actions/github-script@v8
        with:
          script: |
            const title = '🚨 Daily Scrape Failed';
            const body = `## Daily Scrape Workflow Failed
            
            **Run ID:** ${{ github.run_id }}
            **Time:** ${new Date().toISOString()}
            
            The daily movie scrape failed. Possible causes:
            - TIX.id API changed
            - Network timeout
            - Firestore write failed
            - Guest token acquisition failed
            
            **Action Required:**
            1. Check the [workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            2. Re-run the workflow manually if transient failure
            
            cc @${{ github.repository_owner }}`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'scraper']
            });
