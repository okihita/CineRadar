# Daily Initial Scraper - API Edition
# Pure HTTP API scraper (no Playwright required)
name: Scrape National Movies & Showtimes

on:
  schedule:
    - cron: '15 18 * * *'  # 01:15 WIB (18:15 UTC) to avoid top-of-hour congestion
    - cron: '30 22 * * *'  # 05:30 WIB (22:30 UTC) to catch late XXI schedule uploads
  workflow_dispatch:

jobs:
  scrape-movies:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync
        # NOTE: No Playwright installation needed - pure HTTP API

      - name: Scrape Now Playing Movies & Showtimes
        run: PYTHONPATH=. uv run python backend/scripts/run_national_scrape.py
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Link Schedules to Theatres & Cities
        run: PYTHONPATH=. uv run python backend/scripts/post_process.py
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}

      - name: Initialize Performance Data
        run: uv run python -m backend.cli.movie_performance --init-only
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Scrape Metadata for All New Movies
        run: uv run python -m backend.cli movie-details --all
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

  # Note: Seat scraping moved to jit-seat-scrape.yml (runs hourly)

  alert:
    needs: scrape-movies
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Alert on failure
        uses: actions/github-script@v9
        with:
          script: |
            const title = '🚨 Daily Scrape Failed';
            const body = `## Daily Scrape Workflow Failed
            
            **Run ID:** ${{ github.run_id }}
            **Time:** ${new Date().toISOString()}
            
            The daily movie scrape failed. Possible causes:
            - TIX.id API changed
            - Network timeout
            - Firestore write failed
            - Guest token acquisition failed
            
            **Action Required:**
            1. Check the [workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            2. Re-run the workflow manually if transient failure
            
            cc @${{ github.repository_owner }}`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'scraper']
            });
