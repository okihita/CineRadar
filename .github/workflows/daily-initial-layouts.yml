name: Scrape Morning Baseline Seat Layouts

on:
  schedule:
    - cron: '0 19 * * *'   # 02:00 AM WIB (19:00 UTC) - 45m after primary showtime scrape
    - cron: '15 23 * * *'  # 06:15 AM WIB (23:15 UTC previous day) - 45m after backup showtime scrape
  workflow_dispatch:
    inputs:
      force:
        description: 'Force scrape even if checkpoints exist'
        required: false
        default: false
        type: boolean

jobs:
  scrape-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 2 hour limit
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync

      - name: Scrape Initial Seat Layouts (Baseline)
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.force }}" == "true" ]; then
            FORCE_FLAG="--force"
          fi
          PYTHONPATH=. uv run python backend/scripts/scrape_initial_layouts.py $FORCE_FLAG
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

  alert:
    needs: scrape-baseline
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Alert on failure
        uses: actions/github-script@v8
        with:
          script: |
            const title = '🚨 Initial Layout Scrape Failed';
            const body = `## Initial Layout Scrape Workflow Failed
            
            **Run ID:** ${{ github.run_id }}
            **Time:** ${new Date().toISOString()}
            
            The morning baseline scrape failed. Possible causes:
            - TIX.id JWT Token Refresh Failed (Dead Token)
            - Network timeout
            - Too many showtimes / took over 6 hours
            
            **Action Required:**
            1. Check the [workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            2. If Dead Token, acquire a new token via CLI.
            3. Re-run the workflow manually (Checkpointing will ensure it resumes where it left off).
            
            cc @${{ github.repository_owner }}`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'scraper']
            });
