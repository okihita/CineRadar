# Token Refresh Workflow
# Generates a Long-Term (91-day) Refresh Token directly via TIX ID's API using RSA Encryption
# Runs monthly or on manual trigger
# For daily scraping, use the fast API /refresh endpoint instead (see token_refresher.py)
name: Token Refresh

on:
  schedule:
    # 1st of EVERY month @ 2:50 AM WIB (19:50 UTC previous day)
    - cron: '50 19 1 * *'
  workflow_dispatch:  # Manual trigger

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync

      - name: Refresh TIX.id token (Instant RSA API Login)
        id: refresh
        run: uv run python -m backend.cli.refresh_token
        env:
          TIX_PHONE_NUMBER: ${{ secrets.TIX_PHONE_NUMBER }}
          TIX_PASSWORD: ${{ secrets.TIX_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Verify token stored
        if: success()
        run: uv run python -m backend.cli.refresh_token --check
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = '🚨 Token Refresh Failed - Login Flow May Have Changed';
            const body = `## Token Refresh Workflow Failed
            
            **Run ID:** ${{ github.run_id }}
            **Time:** ${new Date().toISOString()}
            
            The RSA API-based login to TIX.id failed. This usually means:
            - The Guest token API endpoint changed
            - TIX.id Public Key has rotated or encryption algorithm changed
            - Credentials are invalid
            
            **Action Required:**
            1. Check the [workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            2. Update \`backend/cli/refresh_token.py\` if selectors changed
            3. Re-run the workflow manually
            
            cc @${{ github.repository_owner }}`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'token-refresh']
            });
