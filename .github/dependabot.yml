# Dependabot Configuration
# Weekly grouped updates to reduce PR noise
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  # Python (pip)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      python-deps:
        patterns:
          - "*"
    commit-message:
      prefix: "deps"

  # pnpm (studio frontend)
  - package-ecosystem: "pnpm"
    directory: "/studio"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      studio-deps:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(studio)"

  # pnpm (web frontend)
  - package-ecosystem: "pnpm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      web-deps:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(web)"
