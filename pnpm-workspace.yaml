packages:
  - 'web'
  - 'studio'

catalog:
  # Framework & Core
  next: 16.3.5
  react: 19.3.0
  react-dom: 19.3.0

  # Shared UI & Styling
  clsx: ^2.1.1
  lucide-react: ^1.47.0
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.3
  '@tailwindcss/postcss': ^4.3.3
  '@xyflow/react': ^12.11.6

  # Tooling & Types
  typescript: ^6.0.3
  eslint: ^10.11.0
  eslint-config-next: 16.3.5
  '@playwright/test': ^1.63.0
  '@types/node': ^26.6.2
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0

overrides:
  fast-xml-parser: '>=5.3.6'
  brace-expansion: '>=5.0.6'
  postcss: '>=8.5.23'
  '@babel/core': '>=7.29.6'
  browserslist: '>=4.28.7'
  sharp: '>=0.35.4'
  baseline-browser-mapping: '>=2.11.0'

allowBuilds:
  unrs-resolver: true
  sharp: false

minimumReleaseAgeExclude:
  - '@next/env@16.3.5'
  - '@next/eslint-plugin-next@16.3.5'
  - '@next/swc-darwin-arm64@16.3.5'
  - '@next/swc-darwin-x64@16.3.5'
  - '@next/swc-linux-arm64-gnu@16.3.5'
  - '@next/swc-linux-arm64-musl@16.3.5'
  - '@next/swc-linux-x64-gnu@16.3.5'
  - '@next/swc-linux-x64-musl@16.3.5'
  - '@next/swc-win32-arm64-msvc@16.3.5'
  - '@next/swc-win32-x64-msvc@16.3.5'
  - eslint-config-next@16.3.5
  - next@16.3.5
  - '@xyflow/react@12.11.6'
  - '@xyflow/system@0.0.82'
