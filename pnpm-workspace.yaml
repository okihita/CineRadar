packages:
  - 'web'
  - 'admin'

catalog:
  # Framework & Core
  next: 16.3.1
  react: 19.2.8
  react-dom: 19.2.8

  # Shared UI & Styling
  clsx: ^2.1.1
  lucide-react: ^1.33.0
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.3
  '@tailwindcss/postcss': ^4.3.3

  # Tooling & Types
  typescript: ^6.0.3
  eslint: ^10.8.1
  eslint-config-next: 16.3.1
  '@types/node': ^26.2.0
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4

overrides:
  fast-xml-parser: '>=5.3.6'
  brace-expansion: '>=5.0.6'
  postcss: '>=8.5.23'
  '@babel/core': '>=7.29.6'

allowBuilds:
  unrs-resolver: true
  sharp: false
