displayName: "JIT Scraper - Critical Error Detected"
description: "Alert immediately when ANY critical error occurs"
combiner: OR
conditions:
  - displayName: "Critical error rate > 0"
    conditionThreshold:
      filter: |
        resource.type="cloud_function"
        AND resource.labels.function_name="scrape-seat-jit"
        AND (
          severity="CRITICAL"
          OR jsonPayload.message contains "CRITICAL"
          OR jsonPayload.message contains "🚨"
        )
      comparison: COMPARISON_GT
      thresholdValue: 0
      aggregations:
        - alignmentPeriod: 300s
          perSeriesAligner: ALIGN_COUNT
          crossSeriesReducer: REDUCE_SUM
      duration: 60s
      trigger:
        count: 1
enabled: true
