displayName: "JIT Scraper - High Error Rate (>5%)"
description: "Alert when error rate exceeds 5% in 5 minutes"
combiner: OR
conditions:
  - displayName: "Error rate > 5%"
    conditionThreshold:
      filter: |
        resource.type="cloud_function"
        AND resource.labels.function_name="scrape-seat-jit"
        AND (
          severity>=ERROR
          OR severity="WARNING"
          OR jsonPayload.message contains "WARNING"
          OR jsonPayload.message contains "⚠️"
        )
      comparison: COMPARISON_GT
      thresholdValue: 5
      aggregations:
        - alignmentPeriod: 300s
          perSeriesAligner: ALIGN_FRACTION_TRUE
          crossSeriesReducer: REDUCE_MEAN
      duration: 300s
      trigger:
        count: 1
enabled: true
