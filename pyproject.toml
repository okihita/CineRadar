# CineRadar Python Configuration

[project]
name = "cineradar"
version = "2.0.0"
description = "Movie availability and seat occupancy tracker for Indonesian cinemas"
requires-python = ">=3.13"
dependencies = [
    "httpx[http2]>=0.28.1",
    "beautifulsoup4>=4.14.3",
    "python-dotenv>=1.2.2",
    "google-cloud-firestore>=2.27.0",
    "pydantic>=2.13.0",
    # Security fix: CVE-2026-26007 - Subgroup Attack on SECT Curves
    "cryptography>=46.0.7",
    "pycryptodomex>=3.23.0",
    "aiolimiter>=1.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.10",
    "mypy>=1.20.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.ruff.lint.per-file-ignores]


[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

# Strict for domain layer
[[tool.mypy.overrides]]
module = "backend.domain.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "mypy>=1.20.1",
    "ruff>=0.15.10",
]
