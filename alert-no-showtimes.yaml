displayName: "JIT Dispatcher - No Showtimes (Business Hours)"
description: "Alert when dispatcher finds 0 showtimes during active hours (9 AM - 11 PM WIB)"
combiner: OR
conditions:
  - displayName: "No showtimes found (consecutive)"
    conditionThreshold:
      filter: |
        resource.type="cloud_function"
        AND resource.labels.function_name="dispatch-jit-jobs"
        AND jsonPayload.showtimes_found=0
        # 9 AM WIB = 02:00 UTC
        # 11 PM WIB = 16:00 UTC
        AND timestamp >= "2026-01-22T02:00:00Z"
        AND timestamp <= "2026-01-22T16:00:00Z"
      comparison: COMPARISON_EQ
      thresholdValue: 0
      aggregations:
        - alignmentPeriod: 900s  # 15 minutes
          perSeriesAligner: ALIGN_COUNT
          crossSeriesReducer: REDUCE_SUM
      duration: 900s
      trigger:
        count: 3  # 3 consecutive empty dispatches = 45 minutes
enabled: true
